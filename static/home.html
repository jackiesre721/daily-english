<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily English</title>
  <link rel="stylesheet" href="/css/app.css">
  <style>
    /* ── Page Header ── */
    .page-header {
      max-width: 960px; margin: 0 auto;
      padding: 28px 20px 0;
    }
    .page-title {
      font-size: 22px; font-weight: 700; color: var(--text);
    }
    .page-subtitle {
      font-size: 14px; font-weight: 400; color: var(--text-light); margin-left: 8px;
    }

    /* ── Search ── */
    .search-area {
      max-width: 960px; margin: 0 auto;
      padding: 16px 20px 0;
    }
    .search-input-wrap {
      position: relative;
    }
    .search-input-wrap svg {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; color: var(--text-light); pointer-events: none;
    }
    .search-input-wrap input {
      width: 100%; padding: 10px 14px 10px 36px;
      border: 1px solid var(--border); border-radius: var(--radius);
      font-family: var(--font-sans); font-size: 14px;
      color: var(--text); background: var(--white);
      outline: none; transition: border-color .15s;
    }
    .search-input-wrap input:focus { border-color: var(--green); }
    .search-input-wrap input::placeholder { color: var(--text-light); }

    /* ── Filter Tags ── */
    .filters {
      max-width: 960px; margin: 0 auto;
      padding: 12px 20px 0;
      display: flex; flex-wrap: wrap; gap: 6px;
    }

    /* ── Article Cards ── */
    .article-grid {
      max-width: 960px; margin: 0 auto;
      padding: 16px 20px 20px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 640px) { .article-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; } }
    @media (min-width: 960px) { .article-grid { grid-template-columns: repeat(3, 1fr); } }

    .article-card {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 18px;
      cursor: pointer; transition: box-shadow .2s, transform .2s;
      display: flex; flex-direction: column;
      text-decoration: none; color: inherit;
      position: relative; overflow: hidden;
    }
    .article-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }

    .article-card-tags {
      display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px;
    }
    .article-tag {
      font-size: 11px; font-weight: 500;
      padding: 2px 8px; border-radius: 4px;
      background: var(--bg); color: var(--text-light);
    }
    .article-tag--source {
      background: var(--green-light); color: var(--green);
    }

    .article-card-title {
      font-size: 15px; font-weight: 600; line-height: 1.4; margin-bottom: 8px; color: var(--text);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    .article-card-meta {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: var(--text-light);
      margin-top: auto;
    }

    .article-card-progress {
      margin-top: 10px;
      height: 3px; background: var(--border); border-radius: var(--radius-full);
      overflow: hidden;
    }
    .article-card-progress__fill {
      height: 100%; background: var(--green); border-radius: var(--radius-full);
      transition: width .3s;
    }

    .article-empty {
      text-align: center; padding: 60px 20px; color: var(--text-light);
      font-size: 14px;
    }

    /* ── Pagination ── */
    .pagination {
      display: flex; justify-content: center; gap: 6px;
      padding: 20px; max-width: 960px; margin: 0 auto;
    }
    .pagination__btn {
      padding: 6px 12px; border: 1px solid var(--border); border-radius: var(--radius);
      font-size: 13px; background: var(--white); color: var(--text-secondary);
      cursor: pointer; transition: all .15s; font-family: var(--font-sans);
    }
    .pagination__btn:hover { border-color: var(--green); color: var(--green); }
    .pagination__btn--active { background: var(--green); color: #fff; border-color: var(--green); }
    .pagination__btn:disabled { opacity: .4; cursor: not-allowed; }
    .pagination__info { font-size: 12px; color: var(--text-light); line-height: 32px; }

    /* ── Tab Content ── */
    .tab-content { display: none; }
    .tab-content--active { display: block; }

    /* ── Vocab Summary Cards ── */
    .summary-cards {
      max-width: 960px; margin: 0 auto;
      padding: 16px 20px 0;
      display: grid; grid-template-columns: repeat(1, 1fr); gap: 12px;
    }
    .summary-card {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 16px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .summary-number {
      font-size: 24px; font-weight: 700; font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }
    .summary-label { font-size: 12px; color: var(--text-light); }
    .summary-card.total .summary-number { color: var(--text); }
    .summary-card.new-words .summary-number { color: var(--green); }
    /* ── Vocab Sub-tabs ── */
    .vocab-tabs {
      max-width: 960px; margin: 0 auto;
      padding: 16px 20px 0;
      display: flex; gap: 4px; flex-wrap: wrap;
    }
    .vocab-tab-btn {
      font-size: 13px; font-weight: 500;
      padding: 7px 16px; border-radius: var(--radius);
      border: 1px solid var(--border); background: var(--white);
      color: var(--text-secondary); cursor: pointer; transition: all .15s;
      font-family: var(--font-sans);
    }
    .vocab-tab-btn:hover { color: var(--text); border-color: var(--text); }
    .vocab-tab-btn.active { background: var(--text); color: var(--white); border-color: var(--text); }

    /* ── Vocab Search ── */
    .vocab-search {
      max-width: 960px; margin: 0 auto;
      padding: 12px 20px 0;
    }
    .vocab-search input {
      width: 100%; padding: 9px 14px;
      border: 1px solid var(--border); border-radius: var(--radius);
      font-family: var(--font-sans); font-size: 14px;
      color: var(--text); background: var(--white);
      outline: none; transition: border-color .15s;
    }
    .vocab-search input:focus { border-color: var(--green); }
    .vocab-search input::placeholder { color: var(--text-light); }

    /* ── Word List Grid (detailed view) ── */
    .word-list {
      max-width: 960px; margin: 0 auto;
      padding: 12px 20px 40px;
      display: grid; grid-template-columns: 1fr; gap: 8px;
    }
    @media (min-width: 640px) { .word-list { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 960px) { .word-list { grid-template-columns: repeat(3, 1fr); } }

    .word-item {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 16px;
      cursor: pointer; transition: box-shadow .2s, transform .2s;
      display: flex; align-items: flex-start; gap: 10px;
      flex-wrap: wrap; overflow: hidden;
    }
    .word-item:hover { box-shadow: var(--shadow-sm); transform: translateY(-1px); }

    .word-status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 6px; }
    .word-status-dot.new { border: 1.5px solid var(--text-light); background: transparent; }

    .word-content { flex: 1; min-width: 0; }
    .word-main { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
    .word-text { font-size: 15px; font-weight: 600; color: var(--text); }
    .word-phonetic { font-size: 12px; color: var(--text-light); }
    .word-pos {
      display: inline-block; font-size: 11px; font-weight: 600; color: var(--green);
      background: var(--green-light); padding: 1px 6px; border-radius: 4px;
    }
    .word-def { font-size: 13px; color: var(--text-secondary); margin-top: 3px; line-height: 1.4; word-break: break-all; }
    .word-meta { display: flex; gap: 8px; margin-top: 4px; font-size: 11px; color: var(--text-light); }
    .word-meta__status { display: inline-flex; align-items: center; gap: 3px; }

    /* ── Word Detail (expanded card) ── */
    .word-item.expanded { background: #FAFFFE; border-color: var(--green); transform: none; }
    .word-detail {
      flex-basis: 100%; width: 100%;
      padding: 10px 0 0; margin-top: 8px;
      border-top: 1px solid var(--border);
      animation: fadeIn .2s ease-out;
      overflow: hidden;
    }
    .word-detail__head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .word-detail__word { font-size: 18px; font-weight: 700; color: var(--green); }
    .word-detail__phonetic { font-size: 13px; color: var(--text-light); }
    .word-detail__def { font-size: 14px; color: var(--text); font-weight: 600; margin-top: 6px; line-height: 1.5; word-break: break-word; }
    .word-detail__tip {
      margin-top: 8px; padding: 8px 10px; border-radius: 6px;
      background: #FFF7E6; border-left: 3px solid #FA8C16;
      font-size: 12px; color: #874D00; line-height: 1.5;
      word-break: break-word;
    }
    .word-detail__related { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
    .word-detail__related-tag {
      font-size: 11px; padding: 2px 8px; border-radius: 4px;
      background: var(--bg); color: var(--text-secondary); border: 1px solid var(--border);
    }
    .word-detail__actions { display: flex; gap: 6px; margin-top: 10px; padding-bottom: 4px; }
    .word-detail__btn {
      padding: 5px 12px; border-radius: 5px; font-size: 12px; font-weight: 600;
      cursor: pointer; border: none; transition: all .15s; font-family: var(--font-sans);
      background: var(--bg); color: var(--text-secondary); border: 1px solid var(--border);
    }
    .word-detail__btn:hover { border-color: var(--text); }
    .word-detail__btn--study { background: var(--green); color: #fff; border-color: var(--green); }
    .word-detail__btn--study:hover { filter: brightness(1.08); }
    .word-detail__btn--study.added { background: var(--green-light); color: var(--green); border: 1px solid var(--green); }
    .word-detail__btn--danger { color: #EF4444; border-color: #FCA5A5; }
    .word-detail__btn--danger:hover { background: #FEF2F2; border-color: #EF4444; }

    /* ── Result Toast ── */
    .result-toast {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: var(--white); border-radius: var(--radius-lg);
      padding: 28px 36px;
      box-shadow: var(--shadow-md); text-align: center; z-index: 300;
      opacity: 0; transition: all .3s; pointer-events: none;
    }
    .result-toast--show { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.3);
      z-index: 250; opacity: 0; transition: opacity .3s; pointer-events: none;
    }
    .overlay--show { opacity: 1; pointer-events: auto; }

    /* ── Responsive ── */
    @media (max-width: 640px) {
        .page-header { padding: 20px 16px 0; }
      .search-area { padding: 12px 16px 0; }
      .filters { padding: 10px 16px 0; }
      .article-grid { padding: 14px 16px 20px; }
      .vocab-tabs { padding: 12px 16px 0; }
      .vocab-search { padding: 10px 16px 0; }
        .word-list { padding: 10px 16px 32px; }
    }

    /* ── Animations ── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeIn 0.3s ease-out both; }

  </style>
</head>
<body>

  <!-- Nav -->
  <div class="header">
    <div class="header-top">
      <a href="home.html" class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
        Daily English
      </a>
      <nav class="nav-tabs">
        <a href="home.html" class="nav-tab active" id="navReading">阅读</a>
        <a href="home.html?tab=vocab" class="nav-tab" id="navVocab">生词</a>
        <a href="import.html" class="nav-tab">导入</a>
        <a href="settings.html" class="nav-tab">设置</a>
      </nav>
    </div>
  </div>

  <!-- ════════════ READING TAB ════════════ -->
  <div class="tab-content tab-content--active" id="tab-reading">

    <div class="page-header">
      <h1 class="page-title">阅读</h1>
    </div>

    <!-- Search -->
    <div class="search-area">
      <div class="search-input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="搜索文章标题或关键词..." id="articleSearch" oninput="filterArticles()">
      </div>
    </div>

    <!-- Filter tags -->
    <div class="filters" id="sourceFilters"></div>

    <!-- Article grid -->
    <div class="article-grid" id="articleList"></div>
    <div class="pagination" id="articlePagination"></div>
  </div>

  <!-- ════════════ VOCAB TAB ════════════ -->
  <div class="tab-content" id="tab-vocab">

    <div class="page-header">
      <h1 class="page-title">生词本<span class="page-subtitle" id="vocabCount">0 词</span></h1>
    </div>

    <!-- Vocab sub-tabs -->
    <div class="vocab-tabs">
      <button class="vocab-tab-btn active" data-vtab="all" onclick="switchVocabTab('all')">单词</button>
      <button class="vocab-tab-btn" data-vtab="phrases" onclick="switchVocabTab('phrases')">短语</button>
    </div>

    <!-- Vocab search (shown for word tabs) -->
    <div class="vocab-search" id="vocabSearchWrap">
      <input type="text" placeholder="搜索单词..." id="vocabSearchInput" oninput="filterVocab()">
    </div>

    <div id="vocabContent"></div>
  </div>

  <!-- Toast + Overlay -->
  <div class="overlay" id="overlay"></div>
  <div class="result-toast" id="toast"><div id="toastContent"></div></div>

<script src="/js/api.js"></script>
<script>
  // ── State ──
  var allVocab = [];
  var filteredVocab = [];
  var currentVocabTab = 'all';
  var articlePage = 1;
  var articlePages = 1;
  var articleTotal = 0;
  var searchTimer = null;
  var vocabSearchTimer = null;
  var currentSource = 'all';

  // ── Tab Switching ──
  function switchTab(tab) {
    document.querySelectorAll('.tab-content').forEach(function(el) { el.classList.remove('tab-content--active'); });
    document.getElementById('tab-' + tab).classList.add('tab-content--active');
    document.getElementById('navReading').classList.toggle('active', tab === 'reading');
    document.getElementById('navVocab').classList.toggle('active', tab === 'vocab');
    history.replaceState(null, '', tab === 'reading' ? 'home.html' : 'home.html?tab=vocab');
    if (tab === 'vocab' && allVocab.length > 0) renderVocabPanel();
  }

  // ── Init ──
  async function init() {
    var params = new URLSearchParams(location.search);
    var tab = params.get('tab') || 'reading';
    switchTab(tab);

    try {
      var [vocabRes, sourcesRes] = await Promise.all([
        GET('/vocabulary/list'),
        GET('/articles/sources')
      ]);
      allVocab = vocabRes.words || [];
      filteredVocab = allVocab.slice();
      updateVocabSummary();
      renderVocabPanel();
      renderSourceFilters(sourcesRes || []);
      loadArticles(1);
    } catch (e) {
      console.error('init error:', e);
      if (allVocab.length > 0) renderVocabPanel();
      loadArticles(1);
    }
  }

  function updateVocabSummary() {
    var total = allVocab.length;
    document.getElementById('vocabCount').textContent = total + ' 词';
  }

  function renderSourceFilters(sources) {
    var html = '<button class="tag active" onclick="setSource(\'all\',this)">全部</button>';
    (sources || []).forEach(function(s) {
      var name = s.name || s.id;
      html += '<button class="tag" onclick="setSource(\'' + escHtml(s.id) + '\',this)' + '">' + escHtml(name) + '</button>';
    });
    document.getElementById('sourceFilters').innerHTML = html;
  }

  function setSource(source, btn) {
    currentSource = source;
    document.querySelectorAll('#sourceFilters .tag').forEach(function(c) { c.classList.remove('active'); });
    btn.classList.add('active');
    loadArticles(1);
  }

  // ── Articles ──
  function escHtml(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function escAttr(s) {
    return String(s || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }
  function speakWord(word) {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(word);
    u.lang = 'en-US'; u.rate = 0.9;
    speechSynthesis.speak(u);
  }
  async function toggleVocabWord(word, add) {
    try {
      if (add) {
        await POST('/vocabulary/study/add', { word: word });
      } else {
        await POST('/vocabulary/study/remove', { word: word });
      }
      // Refresh data
      var vocabRes = await GET('/vocabulary/list');
      allVocab = vocabRes.words || [];
      filteredVocab = allVocab.slice();
      updateVocabSummary();
      renderWordList(document.getElementById('vocabContent'));
    } catch(e) {
      showToast('操作失败: ' + e.message);
    }
  }

  async function removeVocabWord(word) {
    if (!confirm('确定要从生词库中删除「' + word + '」吗？')) return;
    try {
      await POST('/vocabulary/study/remove', { word: word });
      var vocabRes = await GET('/vocabulary/list');
      allVocab = vocabRes.words || [];
      filteredVocab = allVocab.slice();
      updateVocabSummary();
      renderWordList(document.getElementById('vocabContent'));
      showToast('已删除');
    } catch(e) {
      showToast('删除失败: ' + e.message);
    }
  }

  function filterArticles() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function() { loadArticles(1); }, 300);
  }

  async function loadArticles(page) {
    var query = (document.getElementById('articleSearch').value || '').trim();
    var url = '/articles?page=' + page + '&limit=20';
    if (query) url += '&search=' + encodeURIComponent(query);
    if (currentSource && currentSource !== 'all') url += '&source=' + encodeURIComponent(currentSource);
    try {
      var data = await GET(url);
      var articles = data.articles || [];
      articlePage = data.page || page;
      articlePages = data.pages || 1;
      articleTotal = data.total || 0;

      if (articles.length === 0) {
        document.getElementById('articleList').innerHTML = '<div class="article-empty">暂无文章，试试导入一个？</div>';
      } else {
        document.getElementById('articleList').innerHTML = articles.map(function(a) {
          var typeLabel = a.type === 'dialogue' ? '对话' : (a.type === 'web_import' ? '网页' : '短文');
          var tags = (a.tags && a.tags.length > 0) ? a.tags : [typeLabel];
          var tagsHtml = '<span class="article-tag article-tag--source">' + escHtml(typeLabel) + '</span>';
          if (tags[0] && tags[0] !== typeLabel) {
            tagsHtml += '<span class="article-tag">' + escHtml(tags[0]) + '</span>';
          }
          var progressHtml = '';
          if (a.progress > 0 && a.progress < 100) {
            progressHtml = '<div class="article-card-progress"><div class="article-card-progress__fill" style="width:' + Math.round(a.progress) + '%"></div></div>';
          }
          return '<a href="article.html?id=' + a.id + '" class="article-card">' +
            '<div class="article-card-tags">' + tagsHtml + '</div>' +
            '<div class="article-card-title">' + escHtml(a.title_en || a.title_zh) + '</div>' +
            (a.title_zh && a.title_en ? '<div style="font-size:13px;color:var(--text-light);margin-bottom:8px">' + escHtml(a.title_zh) + '</div>' : '') +
            '<div class="article-card-meta">' +
            '</div>' +
            progressHtml +
          '</a>';
        }).join('');
      }
      renderPagination();
    } catch(e) { console.error('loadArticles:', e); }
  }

  function renderPagination() {
    var container = document.getElementById('articlePagination');
    if (articlePages <= 1) { container.innerHTML = ''; return; }
    var html = '<button class="pagination__btn" onclick="loadArticles(' + (articlePage - 1) + ')"' + (articlePage <= 1 ? ' disabled' : '') + '>上一页</button>';
    var start = Math.max(1, articlePage - 2);
    var end = Math.min(articlePages, articlePage + 2);
    if (start > 1) html += '<button class="pagination__btn" onclick="loadArticles(1)">1</button>';
    if (start > 2) html += '<span class="pagination__info">...</span>';
    for (var i = start; i <= end; i++) {
      html += '<button class="pagination__btn' + (i === articlePage ? ' pagination__btn--active' : '') + '" onclick="loadArticles(' + i + ')">' + i + '</button>';
    }
    if (end < articlePages - 1) html += '<span class="pagination__info">...</span>';
    if (end < articlePages) html += '<button class="pagination__btn" onclick="loadArticles(' + articlePages + ')">' + articlePages + '</button>';
    html += '<button class="pagination__btn" onclick="loadArticles(' + (articlePage + 1) + ')"' + (articlePage >= articlePages ? ' disabled' : '') + '>下一页</button>';
    container.innerHTML = html;
  }

  // ── Vocabulary ──
  function switchVocabTab(tab) {
    currentVocabTab = tab;
    document.querySelectorAll('.vocab-tab-btn').forEach(function(el) {
      el.classList.toggle('active', el.dataset.vtab === tab);
    });
    // Show/hide vocab search
    var searchWrap = document.getElementById('vocabSearchWrap');
    searchWrap.style.display = (tab === 'all') ? 'block' : 'none';
    renderVocabPanel();
  }

  function filterVocab() {
    clearTimeout(vocabSearchTimer);
    vocabSearchTimer = setTimeout(function() {
      var q = (document.getElementById('vocabSearchInput').value || '').trim().toLowerCase();
      if (!q) {
        filteredVocab = allVocab.slice();
      } else {
        filteredVocab = allVocab.filter(function(v) {
          return (v.word || '').toLowerCase().indexOf(q) > -1 ||
                 (v.chinese || '').toLowerCase().indexOf(q) > -1;
        });
      }
      renderWordList(document.getElementById('vocabContent'));
    }, 200);
  }

  function renderVocabPanel() {
    var container = document.getElementById('vocabContent');
    if (currentVocabTab === 'all') {
      renderWordList(container);
    } else if (currentVocabTab === 'phrases') {
      loadPhrases();
    }
  }

  function renderWordList(container) {
    var pool = filteredVocab.slice().slice(0, 200);
    if (pool.length === 0) {
      container.innerHTML = '<div class="article-empty">暂无生词</div>';
      return;
    }
    container.innerHTML = '<div class="word-list">' + pool.map(function(v) {
      var status = v.status || 'new';
      var posTag = v.pos ? '<span class="word-pos">' + escHtml(v.pos) + '</span>' : '';
      return '<div class="word-item" data-word="' + escAttr(v.word || '') + '">' +
        '<span class="word-status-dot ' + status + '"></span>' +
        '<div class="word-content">' +
          '<div class="word-main">' +
            '<span class="word-text">' + escHtml(v.word || '') + '</span>' +
            posTag +
            (v.phonetic ? '<span class="word-phonetic">' + escHtml(v.phonetic) + '</span>' : '') +
          '</div>' +
          (v.chinese ? '<div class="word-def">' + escHtml(v.chinese) + '</div>' : '') +
        '</div>' +
      '</div>';
    }).join('') + '</div>';
    // Bind click to expand card detail
    container.querySelectorAll('.word-item').forEach(function(el) {
      el.addEventListener('click', function() {
        var word = el.dataset.word;
        var v = allVocab.find(function(x) { return (x.word || '').toLowerCase() === (word || '').toLowerCase(); });
        if (!v) return;
        // Close any other open
        container.querySelectorAll('.word-item.expanded').forEach(function(other) {
          if (other !== el) { other.classList.remove('expanded'); var d = other.querySelector('.word-detail'); if (d) d.remove(); }
        });
        var existing = el.querySelector('.word-detail');
        if (existing) { existing.remove(); el.classList.remove('expanded'); return; }
        el.classList.add('expanded');
        var inStudy = v.status && v.status !== 'new';
        var tipHtml = '';
        if (v.memory_tip || v.explanation) {
          tipHtml = '<div class="word-detail__tip"><span style="margin-right:4px">💡</span>' + escHtml(v.memory_tip || v.explanation) + '</div>';
        }
        var relatedHtml = '';
        if (v.related_terms) {
          var terms = (typeof v.related_terms === 'string') ? v.related_terms.split(/[,;、，；]/) : v.related_terms;
          if (terms && terms.length) {
            relatedHtml = '<div class="word-detail__related">' +
              terms.filter(function(t){return t && t.trim();}).slice(0, 6).map(function(t) {
                return '<span class="word-detail__related-tag">' + escHtml(t.trim()) + '</span>';
              }).join('') + '</div>';
          }
        }
        var detail = document.createElement('div');
        detail.className = 'word-detail';
        detail.innerHTML =
          '<div class="word-detail__head">' +
            '<span class="word-detail__word">' + escHtml(v.word) + '</span>' +
            (v.phonetic ? '<span class="word-detail__phonetic">' + escHtml(v.phonetic) + '</span>' : '') +
            (v.pos ? '<span class="word-pos">' + escHtml(v.pos) + '</span>' : '') +
          '</div>' +
          '<div class="word-detail__def">' + escHtml(v.chinese || '') + '</div>' +
          tipHtml + relatedHtml +
          '<div class="word-detail__actions">' +
            '<button class="word-detail__btn" onclick="event.stopPropagation();speakWord(\'' + escAttr((v.word||'').toLowerCase()) + '\')">🔊 朗读</button>' +
            '<button class="word-detail__btn word-detail__btn--study' + (inStudy ? ' added' : '') + '" onclick="event.stopPropagation();toggleVocabWord(\'' + escAttr((v.word||'').toLowerCase()) + '\',' + (inStudy ? 'false' : 'true') + ')">' + (inStudy ? '移出生词本' : '+ 加入生词本') + '</button>' +
            '<button class="word-detail__btn word-detail__btn--danger" onclick="event.stopPropagation();removeVocabWord(\'' + escAttr((v.word||'').toLowerCase()) + '\')">删除</button>' +
          '</div>';
        el.appendChild(detail);
      });
    });
  }

  // ── Phrases ──
  async function loadPhrases() {
    var container = document.getElementById('vocabContent');
    try {
      var data = await GET('/phrases');
      var phrases = data.phrases || [];
      if (phrases.length === 0) {
        container.innerHTML = '<div class="article-empty">暂无短语，使用 AI 分析文章时自动提取</div>';
        return;
      }
      var shown = phrases.slice().sort(function() { return Math.random() - 0.5; }).slice(0, 200);
      container.innerHTML = '<div class="word-list">' + shown.map(function(p) {
        var catTag = p.category ? '<span class="word-pos">' + escHtml(p.category) + '</span>' : '';
        return '<div class="word-item" data-phrase="' + escAttr(p.phrase || '') + '">' +
          '<div class="word-content">' +
            '<div class="word-main">' +
              '<span class="word-text">' + escHtml(p.phrase) + '</span>' +
              catTag +
            '</div>' +
            (p.chinese ? '<div class="word-def">' + escHtml(p.chinese) + '</div>' : '') +
          '</div>' +
        '</div>';
      }).join('') + '</div>';
      // Bind click to expand
      container.querySelectorAll('.word-item').forEach(function(el) {
        el.addEventListener('click', function() {
          var phrase = el.dataset.phrase;
          var p = shown.find(function(x) { return x.phrase === phrase; });
          if (!p) return;
          container.querySelectorAll('.word-item.expanded').forEach(function(other) {
            if (other !== el) { other.classList.remove('expanded'); var d = other.querySelector('.word-detail'); if (d) d.remove(); }
          });
          var existing = el.querySelector('.word-detail');
          if (existing) { existing.remove(); el.classList.remove('expanded'); return; }
          el.classList.add('expanded');
          var tipHtml = '';
          if (p.explanation) {
            tipHtml = '<div class="word-detail__tip"><span style="margin-right:4px">💡</span>' + escHtml(p.explanation) + '</div>';
          }
          var ctxHtml = '';
          if (p.source_context) {
            try {
              var ctxs = typeof p.source_context === 'string' ? JSON.parse(p.source_context) : p.source_context;
              if (ctxs && ctxs.length) {
                ctxHtml = '<div class="word-detail__related">' +
                  ctxs.slice(0, 3).map(function(c) {
                    var short = (c.sentence || '').length > 80 ? (c.sentence || '').substring(0, 80) + '…' : (c.sentence || '');
                    return '<div class="word-detail__related-tag" style="white-space:normal;line-height:1.4;text-align:left">…' + escHtml(short) + '</div>';
                  }).join('') + '</div>';
              }
            } catch(e) {}
          }
          var detail = document.createElement('div');
          detail.className = 'word-detail';
          detail.innerHTML =
            '<div class="word-detail__head">' +
              '<span class="word-detail__word">' + escHtml(p.phrase) + '</span>' +
            '</div>' +
            '<div class="word-detail__def">' + escHtml(p.chinese || '') + '</div>' +
            tipHtml + ctxHtml +
            '<div class="word-detail__actions">' +
              '<button class="word-detail__btn" onclick="event.stopPropagation();speakWord(\'' + escAttr((p.phrase||'').toLowerCase()) + '\')">🔊 朗读</button>' +
            '</div>';
          el.appendChild(detail);
        });
      });
    } catch(e) {
      container.innerHTML = '<div class="article-empty" style="color:#F5222D">加载失败</div>';
    }
  }

  function showToast(html, duration) {
    document.getElementById('toastContent').innerHTML = html;
    document.getElementById('toast').classList.add('result-toast--show');
    document.getElementById('overlay').classList.add('overlay--show');
    setTimeout(function() {
      document.getElementById('toast').classList.remove('result-toast--show');
      document.getElementById('overlay').classList.remove('overlay--show');
    }, duration || 1200);
  }

  // ── Start ──
  init();
</script>
</body>
</html>
